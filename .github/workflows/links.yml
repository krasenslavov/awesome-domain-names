name: links
on:
  schedule:
    - cron: "0 6 1 * *"   # the first day of every month
  workflow_dispatch:
permissions:
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --no-progress --max-concurrency 4 --accept 200,201,202,203,204,206,429 readme.md
          fail: false
      - name: Open an issue when links are dead
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found
          content-filepath: ./lychee/out.md
          labels: maintenance
